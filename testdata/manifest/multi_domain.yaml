domains:
  - name: mobile-app
    description: Mobile gateway
    owner: mobile-team
    scan:
      include: ["mobile-gateway/**", "push-service/**"]
  - name: core-api
    description: Core business logic
    owner: backend-team
    scan:
      include: ["orders-api/**", "payments-api/**", "users-api/**"]
  - name: crm
    description: CRM panel
    owner: crm-team
    scan:
      include: ["crm-api/**", "crm-worker/**"]

tech: [nestjs, kafka]
instruction_packs: ["framework/nestjs"]

infrastructure:
  - name: events-kafka
    type: broker
    address: kafka-events.internal:9092
    description: Event bus for async workflows
  - name: redis
    type: cache
    address: redis.internal:6379
    description: Session cache
