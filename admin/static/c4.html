<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C4 Architecture — Chronicle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #1a1a2e; color: #e0e0e0;
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
}

/* ── Header ── */
.header {
  padding: 8px 20px; background: #16213e;
  border-bottom: 1px solid #2a2a4a;
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
}
.header-logo { font-size: 13px; color: #6b6b8a; font-weight: 600; text-decoration: none; }
.header-logo:hover { color: #9090c0; }

.level-tabs { display: flex; gap: 1px; background: #0f0f23; border-radius: 6px; padding: 2px; }
.lt {
  padding: 5px 14px; border: none; background: none;
  color: #4a4a6a; font-size: 10px; font-weight: 600;
  cursor: pointer; border-radius: 4px; transition: all 0.15s;
  white-space: nowrap;
}
.lt:hover { color: #8080a0; background: #1a1a3a; }
.lt.active { background: #2a2a5a; color: #fff; }
.lt:disabled { opacity: 0.3; cursor: default; }
.lt:disabled:hover { color: #4a4a6a; background: none; }

/* ── Breadcrumb ── */
.breadcrumb {
  padding: 5px 20px; background: #111128;
  border-bottom: 1px solid #1a1a3a;
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; flex-shrink: 0;
}
.bc-item { color: #4a6a8a; cursor: pointer; }
.bc-item:hover { color: #7ba3d4; }
.bc-item.cur { color: #c0c0e0; font-weight: 600; cursor: default; }
.bc-sep { color: #2a2a4a; font-size: 9px; }

/* ── Main layout ── */
.main { display: flex; flex: 1; overflow: hidden; }
.canvas-area { flex: 1; overflow: auto; position: relative; padding: 28px; }
.sidebar {
  width: 190px; background: #111128;
  border-left: 1px solid #2a2a4a;
  padding: 14px; overflow-y: auto; flex-shrink: 0;
  font-size: 9px;
}

/* ── Sidebar ── */
.side-section { margin-bottom: 14px; }
.side-label {
  font-size: 8px; color: #3a3a5a;
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 6px; font-weight: 600;
}
.side-row {
  display: flex; justify-content: space-between;
  padding: 3px 0; border-bottom: 1px solid #1a1a3a;
}
.side-row .l { color: #5a5a7a; }
.side-row .v { color: #8a8aa0; font-weight: 600; }
.info-box {
  margin-top: 8px; padding: 8px; background: #0a0a1a;
  border-radius: 5px;
}
.ib-title {
  font-size: 7px; color: #3a3a5a;
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;
}
.ib-val { font-size: 10px; color: #a0a0c0; font-weight: 600; }
.ib-desc { font-size: 8px; color: #4a4a6a; margin-top: 2px; }

/* Legend */
.legend-row {
  display: flex; align-items: center; gap: 6px;
  padding: 2px 0; font-size: 8px; color: #5a5a7a;
}
.legend-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.legend-line {
  width: 18px; height: 2px; flex-shrink: 0;
}

/* ── Error / Loading ── */
.status-banner {
  margin: 20px; padding: 12px 16px; border-radius: 6px;
  font-size: 12px;
}
.status-banner.error { background: #2a1a1a; border: 1px solid #7a2a2a; color: #d08080; }
.status-banner.loading { background: #1a1a2e; border: 1px solid #2a2a4a; color: #5a5a8a; }

/* ── SVG overlay ── */
#arrow-svg {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; overflow: visible;
}
.canvas-wrap { position: relative; }

/* ─────────────── C1 ─────────────── */
.c1-layout {
  display: flex; flex-direction: column;
  align-items: center; gap: 28px;
}
.c1-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.section-label {
  font-size: 9px; color: #3a3a5a;
  text-transform: uppercase; letter-spacing: 1.5px;
  font-weight: 600; align-self: flex-start;
}

.ext-card {
  background: #1e1e32; border: 1px dashed #3a3a5a;
  border-radius: 6px; padding: 10px 16px; text-align: center;
  min-width: 110px; transition: all 0.15s;
}
.ext-card h4 { font-size: 10px; color: #9090b0; }
.ext-card .sub { font-size: 8px; color: #4a4a6a; margin-top: 2px; }

.sys-card {
  background: linear-gradient(135deg, #1e3a5f, #1a2d4d);
  border: 2px solid #3a7bd5; border-radius: 10px;
  padding: 20px 40px; text-align: center;
  cursor: pointer; transition: all 0.2s;
}
.sys-card:hover { border-color: #5a9bf5; box-shadow: 0 4px 24px rgba(58,123,213,0.25); }
.sys-card h3 { font-size: 15px; color: #fff; }
.sys-card .sys-sub { font-size: 9px; color: #6a9ad0; margin-top: 3px; }
.sys-card .sys-stats { font-size: 8px; color: #4a7aad; margin-top: 5px; }
.sys-card .sys-hint { font-size: 8px; color: #3a6a9a; margin-top: 8px; }

.infra-card {
  background: #1a2e1a; border: 1px solid #2d5a2d;
  border-radius: 6px; padding: 9px 14px; text-align: center;
  min-width: 90px; transition: all 0.15s;
}
.infra-card.unused { border-style: dashed; opacity: 0.65; }
.infra-card h4 { font-size: 10px; color: #7db87d; }
.infra-card .sub { font-size: 8px; color: #4a8a4a; margin-top: 2px; }
.badge-declared {
  display: inline-block; margin-top: 4px;
  font-size: 7px; color: #4a7a4a; background: #0a1a0a;
  padding: 1px 5px; border-radius: 8px; border: 1px solid #2a4a2a;
}

/* ─────────────── C2 ─────────────── */
.c2-layout {
  display: flex; flex-direction: column; gap: 24px; align-items: stretch;
}
.c2-row { display: flex; gap: 14px; flex-wrap: wrap; }

.svc-card {
  background: linear-gradient(135deg, #1e3a5f, #162a48);
  border: 2px solid #2a5a8a; border-radius: 8px;
  padding: 14px 18px; min-width: 170px; flex: 1; max-width: 230px;
  cursor: pointer; transition: all 0.2s;
}
.svc-card:hover { border-color: #4a8ad5; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(58,123,213,0.18); }
.svc-card h4 { font-size: 12px; color: #fff; }
.svc-card .tech { font-size: 8px; color: #4a7aad; margin-top: 2px; }
.svc-card .svc-stats {
  display: flex; gap: 8px; margin-top: 8px;
  font-size: 8px; color: #3a6a9a; flex-wrap: wrap;
}
.svc-card .svc-stats b { color: #6a9ad0; }
.svc-card .drill { font-size: 8px; color: #3a5a8a; margin-top: 6px; }

.topic-pill {
  background: #1f1f3a; border: 1px solid #4a3a7a;
  border-radius: 16px; padding: 7px 14px; text-align: center;
  min-width: 120px;
}
.topic-pill h4 { font-size: 10px; color: #9080c0; }
.topic-pill .sub { font-size: 8px; color: #5a4a8a; margin-top: 2px; }
.topic-pill .transport {
  font-size: 7px; color: #4a3a6a; margin-top: 3px;
  text-transform: uppercase; letter-spacing: 0.5px;
}

.ext2-card {
  background: #1e1e32; border: 1px dashed #4a3a3a;
  border-radius: 6px; padding: 10px 16px; text-align: center;
  min-width: 110px;
}
.ext2-card h4 { font-size: 10px; color: #9080a0; }
.ext2-card .sub { font-size: 8px; color: #5a4a6a; margin-top: 2px; }

/* ─────────────── C3 ─────────────── */
.c3-layout {
  display: flex; flex-direction: column; gap: 16px;
}
.c3-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
}
.c3-header h2 { font-size: 14px; color: #fff; }
.back-btn {
  font-size: 10px; color: #4a6a8a; cursor: pointer;
  background: #111128; border: 1px solid #2a2a4a;
  padding: 3px 10px; border-radius: 4px; transition: all 0.15s;
}
.back-btn:hover { color: #7ba3d4; border-color: #3a5a8a; }

.c3-body { display: flex; gap: 16px; align-items: flex-start; }
.c3-modules { flex: 1; display: flex; flex-direction: column; gap: 14px; }

.module-box {
  background: #111128; border: 1px solid #2a2a4a;
  border-radius: 8px; padding: 14px 16px;
}
.module-label {
  font-size: 8px; color: #3a3a6a;
  text-transform: uppercase; letter-spacing: 1px;
  font-weight: 600; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.module-label::before {
  content: ''; display: inline-block;
  width: 3px; height: 10px;
  background: #d4915e; border-radius: 2px;
}
.comp-grid { display: flex; gap: 8px; flex-wrap: wrap; }

.comp-card {
  background: #141430; border: 1px solid #2a2a4a;
  border-radius: 6px; padding: 9px 12px;
  min-width: 140px; flex: 1; max-width: 200px;
  transition: all 0.15s; cursor: default;
}
.comp-card:hover { border-color: #4a4a7a; background: #1a1a3a; }
.comp-card.t-controller { border-left: 3px solid #4a9aea; }
.comp-card.t-provider { border-left: 3px solid #7db87d; }
.comp-card.t-gateway { border-left: 3px solid #d4d45e; }
.comp-card h5 { font-size: 10px; color: #c0c0e0; font-weight: 500; }
.comp-card .comp-type {
  font-size: 7px; color: #4a4a6a;
  text-transform: uppercase; letter-spacing: 0.4px; margin-top: 1px;
}
.comp-card .ep-pill {
  display: inline-block; margin: 2px 2px 0 0;
  font-size: 7px; color: #4a7aad;
  background: #0a1a2a; padding: 1px 5px;
  border-radius: 3px; border: 1px solid #1a3a5a;
}
.comp-card .model-chip {
  display: inline-block; margin: 2px 2px 0 0;
  font-size: 7px; color: #7a4ab0;
  background: #1a0a2a; padding: 1px 5px;
  border-radius: 3px; border: 1px solid #3a1a5a;
}

/* Boundary panel */
.boundary-panel {
  width: 210px; flex-shrink: 0;
  background: #111128; border: 1px solid #2a2a4a;
  border-radius: 8px; padding: 12px 14px;
}
.boundary-panel h3 {
  font-size: 9px; color: #3a3a5a;
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 10px; font-weight: 600;
}
.boundary-section { margin-bottom: 10px; }
.boundary-section-label {
  font-size: 8px; color: #3a4a6a;
  margin-bottom: 5px; font-weight: 600;
}
.boundary-item {
  display: flex; align-items: flex-start; gap: 6px;
  padding: 4px 6px; border-radius: 4px; margin-bottom: 2px;
  font-size: 9px;
}
.boundary-item:hover { background: #1a1a38; }
.boundary-item .dir { color: #3a5a7a; width: 12px; flex-shrink: 0; }
.boundary-item .name { color: #9090c0; font-weight: 500; }
.boundary-item .kind {
  font-size: 7px; color: #4a4a6a;
  background: #0a0a1a; padding: 1px 4px;
  border-radius: 2px; margin-top: 1px;
}
.boundary-item .via { font-size: 8px; color: #3a3a5a; display: block; margin-top: 1px; }

/* ── Hover highlight ── */
.arrow-path { transition: opacity 0.15s, stroke-opacity 0.15s; }
.arrow-label-bg { transition: opacity 0.15s; }
.arrow-label-text { transition: opacity 0.15s; }

/* dim state set via JS class on svg */
#arrow-svg.has-highlight .arrow-group { opacity: 0.12; }
#arrow-svg.has-highlight .arrow-group.highlighted { opacity: 1; }

/* Cards highlighted state */
.card-node.dimmed { opacity: 0.3; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <a class="header-logo" href="/">Chronicle</a>
  <div class="level-tabs">
    <button class="lt" id="tab-c1" onclick="setLevel('c1')">C1 Context</button>
    <button class="lt" id="tab-c2" onclick="setLevel('c2')">C2 Containers</button>
    <button class="lt" id="tab-c3" disabled onclick="setLevel('c3')">C3 Components</button>
  </div>
</div>

<!-- Breadcrumb -->
<div class="breadcrumb" id="breadcrumb"></div>

<!-- Main -->
<div class="main">
  <div class="canvas-area" id="canvas-area">
    <div id="canvas-wrap" class="canvas-wrap">
      <svg id="arrow-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr-solid" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#4a8ad5"/>
          </marker>
          <marker id="arr-async" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9080c0"/>
          </marker>
          <marker id="arr-inject" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#7db87d"/>
          </marker>
          <marker id="arr-infra" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#4a7a4a"/>
          </marker>
        </defs>
      </svg>
      <div id="content"></div>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="side-section" id="stats-section">
      <div class="side-label">System Stats</div>
      <div id="stats-rows"></div>
    </div>
    <div class="side-section">
      <div class="side-label">Current Level</div>
      <div class="info-box">
        <div class="ib-title">Level</div>
        <div class="ib-val" id="sb-level">—</div>
        <div class="ib-desc" id="sb-desc">—</div>
      </div>
    </div>
    <div class="side-section" id="legend-section"></div>
  </div>
</div>

<script>
'use strict';

/* ──────────────────────────────────────────────────────
   STATE
────────────────────────────────────────────────────── */
const state = {
  domain: '',
  level: 'c1',       // 'c1' | 'c2' | 'c3'
  service: null,     // for c3
  c1Data: null,
  c2Data: null,
  c3Data: null,
};

/* ──────────────────────────────────────────────────────
   BOOTSTRAP
────────────────────────────────────────────────────── */
(async function init() {
  const params = new URLSearchParams(location.search);
  state.domain = params.get('domain') || '';
  state.level  = params.get('level')  || 'c1';
  state.service= params.get('service')|| null;

  if (!state.domain) {
    showBanner('error', 'No domain specified. Add ?domain=&lt;name&gt; to the URL.');
    return;
  }

  // Load C1 always (for stats)
  try {
    const r = await fetch(`/api/c4/c1?domain=${encodeURIComponent(state.domain)}`);
    if (!r.ok) throw new Error(`C1 API returned ${r.status}`);
    state.c1Data = await r.json();
    renderStats(state.c1Data.stats);
  } catch(e) {
    showBanner('error', `Failed to load C1 data: ${e.message}`);
    return;
  }

  // Restore from URL
  window.addEventListener('popstate', onPopState);
  renderLevel(state.level);
})();

/* ──────────────────────────────────────────────────────
   ROUTING
────────────────────────────────────────────────────── */
function pushState(lvl, svc) {
  const p = new URLSearchParams({ domain: state.domain, level: lvl });
  if (svc) p.set('service', svc);
  history.pushState({ level: lvl, service: svc||null }, '', '/c4.html?' + p.toString());
}

function onPopState(e) {
  if (e.state) {
    state.level   = e.state.level;
    state.service = e.state.service;
    renderLevel(state.level, true);
  }
}

async function setLevel(lvl, svc) {
  state.level = lvl;
  if (svc !== undefined) state.service = svc;
  pushState(lvl, state.service);
  await renderLevel(lvl);
}

async function renderLevel(lvl, skipPush) {
  try {
    if (lvl === 'c1') {
      renderC1(state.c1Data);
    } else if (lvl === 'c2') {
      if (!state.c2Data) {
        showBanner('loading', 'Loading containers…');
        const r = await fetch(`/api/c4/c2?domain=${encodeURIComponent(state.domain)}`);
        if (!r.ok) throw new Error(`C2 API returned ${r.status}`);
        state.c2Data = await r.json();
      }
      renderC2(state.c2Data);
    } else if (lvl === 'c3') {
      if (!state.service) { setLevel('c2'); return; }
      showBanner('loading', `Loading components for ${state.service}…`);
      const r = await fetch(`/api/c4/c3?domain=${encodeURIComponent(state.domain)}&service=${encodeURIComponent(state.service)}`);
      if (!r.ok) throw new Error(`C3 API returned ${r.status}`);
      state.c3Data = await r.json();
      renderC3(state.c3Data);
    }
  } catch(e) {
    showBanner('error', e.message);
  }
}

/* ──────────────────────────────────────────────────────
   TABS + BREADCRUMB
────────────────────────────────────────────────────── */
function setTabs(lvl) {
  ['c1','c2','c3'].forEach(l => {
    const t = document.getElementById('tab-'+l);
    t.classList.toggle('active', l === lvl);
  });
  const t3 = document.getElementById('tab-c3');
  t3.disabled = !state.service && lvl !== 'c3';
}

function setBreadcrumb(items) {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  items.forEach((it, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'bc-sep'; sep.textContent = '›';
      bc.appendChild(sep);
    }
    const el = document.createElement('span');
    el.className = 'bc-item' + (it.cur ? ' cur' : '');
    el.textContent = it.label;
    if (it.action) el.onclick = it.action;
    bc.appendChild(el);
  });
}

function setSidebar(level, desc) {
  document.getElementById('sb-level').textContent = level;
  document.getElementById('sb-desc').textContent  = desc;
}

/* ──────────────────────────────────────────────────────
   STATS
────────────────────────────────────────────────────── */
function renderStats(stats) {
  if (!stats) return;
  const rows = [
    ['Services',  stats.services  || 0],
    ['Endpoints', stats.endpoints || 0],
    ['Models',    stats.models    || 0],
    ['Topics',    stats.topics    || 0],
    ['Flows',     stats.flows     || 0],
  ];
  document.getElementById('stats-rows').innerHTML = rows.map(([l,v]) =>
    `<div class="side-row"><span class="l">${l}</span><span class="v">${v}</span></div>`
  ).join('');
}

function setLegend(items) {
  const sec = document.getElementById('legend-section');
  if (!items || !items.length) { sec.innerHTML = ''; return; }
  sec.innerHTML = '<div class="side-label">Legend</div>' + items.map(it =>
    `<div class="legend-row">
       <div class="legend-line" style="background:${it.color};${it.dashed?'background:repeating-linear-gradient(90deg,'+it.color+' 0,'+it.color+' 4px,transparent 4px,transparent 7px)':''}"></div>
       <span>${it.label}</span>
     </div>`
  ).join('');
}

/* ──────────────────────────────────────────────────────
   ARROW ENGINE
────────────────────────────────────────────────────── */
let arrowGroups = [];
let pendingArrows = [];  // drawn after layout

function clearArrows() {
  arrowGroups = [];
  pendingArrows = [];
  const svg = document.getElementById('arrow-svg');
  // Remove all arrow groups (keep defs)
  Array.from(svg.children).forEach(c => {
    if (c.tagName.toLowerCase() !== 'defs') c.remove();
  });
  svg.classList.remove('has-highlight');
}

function queueArrows(arrows) {
  pendingArrows = arrows;
}

function flushArrows() {
  if (!pendingArrows.length) return;
  // Give DOM a tick to settle positions
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      pendingArrows.forEach(a => drawArrow(a));
      pendingArrows = [];
    });
  });
}

/**
 * arrow: { fromId, toId, kind, label, groupKey }
 * kind: 'http' | 'async' | 'inject' | 'infra'
 */
function drawArrow({ fromId, toId, kind, label, groupKey }) {
  const fromEl = document.getElementById(fromId);
  const toEl   = document.getElementById(toId);
  if (!fromEl || !toEl) return;

  const svg = document.getElementById('arrow-svg');
  const svgRect = svg.getBoundingClientRect();

  const fRect = fromEl.getBoundingClientRect();
  const tRect = toEl.getBoundingClientRect();

  const fx = fRect.left + fRect.width  / 2 - svgRect.left;
  const fy = fRect.top  + fRect.height / 2 - svgRect.top;
  const tx = tRect.left + tRect.width  / 2 - svgRect.left;
  const ty = tRect.top  + tRect.height / 2 - svgRect.top;

  // Exit points: use edge midpoints instead of centers for cleaner routing
  const {ax, ay, bx, by} = edgePoints(fRect, tRect, svgRect);

  // Cubic bezier control points
  const dx = bx - ax;
  const dy = by - ay;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const bend = Math.min(dist * 0.4, 80);

  // Perpendicular offset to curve away from direct line
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;

  // Control points: slightly off the direct line
  const cx1 = ax + dx * 0.25;
  const cy1 = ay + dy * 0.25 - bend * 0.3;
  const cx2 = ax + dx * 0.75;
  const cy2 = ay + dy * 0.75 - bend * 0.3;

  const pathD = `M${ax},${ay} C${cx1},${cy1} ${cx2},${cy2} ${bx},${by}`;

  const colors = {
    http:   '#4a8ad5',
    async:  '#9080c0',
    inject: '#7db87d',
    infra:  '#4a7a4a',
  };
  const color = colors[kind] || '#4a5a7a';
  const dashed = kind === 'async' ? '5,3' : kind === 'inject' ? '3,3' : null;
  const marker = `url(#arr-${kind === 'inject' ? 'inject' : kind === 'async' ? 'async' : kind === 'infra' ? 'infra' : 'solid'})`;

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.className.baseVal = 'arrow-group';
  if (groupKey) {
    g.dataset.from = fromId;
    g.dataset.to   = toId;
    g.dataset.group = groupKey;
  }

  // Path
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', pathD);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', color);
  path.setAttribute('stroke-width', '1.5');
  path.setAttribute('marker-end', marker);
  path.className.baseVal = 'arrow-path';
  if (dashed) path.setAttribute('stroke-dasharray', dashed);

  g.appendChild(path);

  // Label
  if (label) {
    const lx = (ax + bx) / 2 + (cy1 - ay) * -0.15;
    const ly = (ay + by) / 2 + (cx1 - ax) * 0.05 - 8;

    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.className.baseVal = 'arrow-label-bg';
    bg.setAttribute('x', lx - 18); bg.setAttribute('y', ly - 8);
    bg.setAttribute('width', '36'); bg.setAttribute('height', '12');
    bg.setAttribute('rx', '3'); bg.setAttribute('fill', '#111128');
    bg.setAttribute('opacity', '0.85');
    g.appendChild(bg);

    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.className.baseVal = 'arrow-label-text';
    txt.setAttribute('x', lx); txt.setAttribute('y', ly);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('dominant-baseline', 'middle');
    txt.setAttribute('font-size', '7');
    txt.setAttribute('fill', color);
    txt.textContent = label;
    g.appendChild(txt);
  }

  svg.appendChild(g);
  arrowGroups.push({ el: g, fromId, toId, groupKey });
}

function edgePoints(fRect, tRect, svgRect) {
  // Determine exit/entry edges based on relative positions
  const fcx = fRect.left + fRect.width/2;
  const fcy = fRect.top  + fRect.height/2;
  const tcx = tRect.left + tRect.width/2;
  const tcy = tRect.top  + tRect.height/2;

  const sx = svgRect.left;
  const sy = svgRect.top;

  const dx = tcx - fcx;
  const dy = tcy - fcy;

  let ax, ay, bx, by;

  // From card exit
  if (Math.abs(dx) > Math.abs(dy)) {
    // Horizontal dominant
    if (dx > 0) {
      ax = fRect.right  - sx; ay = fcy - sy;
      bx = tRect.left   - sx; by = tcy - sy;
    } else {
      ax = fRect.left   - sx; ay = fcy - sy;
      bx = tRect.right  - sx; by = tcy - sy;
    }
  } else {
    // Vertical dominant
    if (dy > 0) {
      ax = fcx - sx; ay = fRect.bottom - sy;
      bx = tcx - sx; by = tRect.top    - sy;
    } else {
      ax = fcx - sx; ay = fRect.top    - sy;
      bx = tcx - sx; by = tRect.bottom - sy;
    }
  }

  return { ax, ay, bx, by };
}

/* ── Hover highlight ── */
function setupHoverHighlight(cardEls, getRelatedGroupKeys) {
  const svg = document.getElementById('arrow-svg');

  function enter(nodeId) {
    const related = getRelatedGroupKeys(nodeId);
    svg.classList.add('has-highlight');
    arrowGroups.forEach(g => {
      const isRel = related.has(g.fromId) || related.has(g.toId) ||
                    (g.fromId === nodeId || g.toId === nodeId);
      g.el.classList.toggle('highlighted', isRel);
    });
    cardEls.forEach(el => {
      const id = el.id;
      el.classList.toggle('dimmed', id !== nodeId && !related.has(id));
    });
  }

  function leave() {
    svg.classList.remove('has-highlight');
    arrowGroups.forEach(g => g.el.classList.remove('highlighted'));
    cardEls.forEach(el => el.classList.remove('dimmed'));
  }

  cardEls.forEach(el => {
    el.addEventListener('mouseenter', () => enter(el.id));
    el.addEventListener('mouseleave', leave);
  });

  // Click empty space to reset
  document.getElementById('canvas-area').addEventListener('click', e => {
    if (e.target.closest('.card-node, button, a')) return;
    leave();
  });
}

/* Recompute arrows on resize */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const lvl = state.level;
    if (lvl === 'c1' && state.c1Data) { clearArrows(); renderC1Arrows(state.c1Data); }
    if (lvl === 'c2' && state.c2Data) { clearArrows(); renderC2Arrows(state.c2Data); }
    if (lvl === 'c3' && state.c3Data) { clearArrows(); renderC3Arrows(state.c3Data); }
  }, 120);
});

/* ──────────────────────────────────────────────────────
   UTILITIES
────────────────────────────────────────────────────── */
function showBanner(type, msg) {
  document.getElementById('content').innerHTML =
    `<div class="status-banner ${type}">${msg}</div>`;
  clearArrows();
}

function keyToId(key) {
  return 'node-' + key.replace(/[^a-zA-Z0-9_-]/g, '_');
}

/* ──────────────────────────────────────────────────────
   C1 RENDER
────────────────────────────────────────────────────── */
function renderC1(data) {
  setTabs('c1');
  setBreadcrumb([
    { label: data.name || data.domain, cur: true }
  ]);
  setSidebar('C1 Context', 'System boundary view');
  setLegend([
    { color: '#4a8ad5', label: 'HTTP / sync' },
    { color: '#9080c0', label: 'Async / events', dashed: true },
    { color: '#4a7a4a', label: 'Infrastructure' },
  ]);

  const stats = data.stats || {};
  const statsLine = [
    stats.services   && `${stats.services} services`,
    stats.endpoints  && `${stats.endpoints} endpoints`,
    stats.models     && `${stats.models} models`,
    stats.topics     && `${stats.topics} topics`,
  ].filter(Boolean).join(' · ');

  // External systems
  const externalsHtml = (data.externals || []).map(ex => {
    const id = keyToId(ex.key);
    const callers = ex.calls_from && ex.calls_from.length
      ? `<div class="sub">called by ${ex.calls_from.join(', ')}</div>` : '';
    return `<div class="ext-card card-node" id="${id}">
      <h4>${esc(ex.name)}</h4>
      ${callers}
    </div>`;
  }).join('');

  // Infra
  const infraHtml = (data.infra || []).map(inf => {
    const id = keyToId(inf.key);
    const unused = !inf.used;
    return `<div class="infra-card card-node ${unused ? 'unused' : ''}" id="${id}">
      <h4>${esc(inf.name)}</h4>
      <div class="sub">${esc(inf.kind || '')}</div>
      ${unused ? '<div class="badge-declared">declared</div>' : ''}
    </div>`;
  }).join('');

  const sysId = 'node-system';

  document.getElementById('content').innerHTML = `
    <div class="c1-layout">
      ${externalsHtml ? `
        <div class="section-label">External Systems</div>
        <div class="c1-row">${externalsHtml}</div>
      ` : ''}
      <div class="sys-card card-node" id="${sysId}" onclick="setLevel('c2')">
        <h3>${esc(data.name || data.domain)}</h3>
        ${statsLine ? `<div class="sys-stats">${esc(statsLine)}</div>` : ''}
        <div class="sys-hint">Click to drill down →</div>
      </div>
      ${infraHtml ? `
        <div class="section-label">Infrastructure</div>
        <div class="c1-row">${infraHtml}</div>
      ` : ''}
    </div>`;

  clearArrows();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    renderC1Arrows(data);
    // Hover
    const cards = Array.from(document.querySelectorAll('#content .card-node'));
    setupHoverHighlight(cards, (id) => {
      const related = new Set();
      arrowGroups.forEach(g => {
        if (g.fromId === id) related.add(g.toId);
        if (g.toId   === id) related.add(g.fromId);
      });
      return related;
    });
  }));
}

function renderC1Arrows(data) {
  const sysId = 'node-system';
  (data.edges || []).forEach((e, i) => {
    const fromId = e.from === 'system' ? sysId : keyToId(e.from);
    const toId   = e.to   === 'system' ? sysId : keyToId(e.to);
    const kind = (data.infra || []).some(inf => inf.key === e.to || inf.key === e.from)
      ? 'infra' : 'http';
    drawArrow({ fromId, toId, kind, label: e.label, groupKey: `c1-${i}` });
  });
}

/* ──────────────────────────────────────────────────────
   C2 RENDER
────────────────────────────────────────────────────── */
function renderC2(data) {
  setTabs('c2');
  setBreadcrumb([
    { label: state.c1Data?.name || state.domain, action: () => setLevel('c1') },
    { label: 'Containers', cur: true }
  ]);
  setSidebar('C2 Containers', `${(data.services||[]).length} services`);
  setLegend([
    { color: '#4a8ad5', label: 'HTTP call' },
    { color: '#9080c0', label: 'Async (publishes)', dashed: true },
    { color: '#9080c0', label: 'Async (consumes)', dashed: true },
  ]);

  // Separate internal queue topics from kafka topics
  const internalTopics = (data.topics || []).filter(t => t.internal);
  const externalTopics = (data.topics || []).filter(t => !t.internal);

  // Build service cards — internal queue topics render as small badge on their service
  const svcHtml = (data.services || []).map(svc => {
    const id = keyToId(svc.key);
    const s  = svc.stats || {};
    const queues = internalTopics.filter(t =>
      (t.publishers || []).includes(svc.name) || (t.consumers || []).includes(svc.name)
    );
    const queueBadges = queues.map(q =>
      `<span style="font-size:7px;color:#5a4a8a;background:#1a1a2e;padding:1px 5px;border-radius:8px;border:1px solid #3a2a5a;margin-right:3px">↻ ${esc(q.name)}</span>`
    ).join('');
    return `<div class="svc-card card-node" id="${id}" onclick="drillC3('${esc(svc.name)}')">
      <h4>${esc(svc.name)}</h4>
      <div class="tech">${esc(svc.tech || '')}</div>
      <div class="svc-stats">
        ${s.endpoints  != null ? `<span><b>${s.endpoints}</b> ep</span>` : ''}
        ${s.models     != null ? `<span><b>${s.models}</b> models</span>` : ''}
        ${s.providers  != null ? `<span><b>${s.providers}</b> prov</span>` : ''}
      </div>
      ${queueBadges ? `<div style="margin-top:5px">${queueBadges}</div>` : ''}
      <div class="drill">→ components</div>
    </div>`;
  }).join('');

  // External cards
  const extHtml = (data.externals || []).map(ex => {
    const id = keyToId(ex.key);
    return `<div class="ext2-card card-node" id="${id}">
      <h4>${esc(ex.name)}</h4>
      <div class="sub">external</div>
    </div>`;
  }).join('');

  // Topic pills (kafka / non-internal)
  const topicsHtml = externalTopics.map(t => {
    const id = keyToId(t.key);
    return `<div class="topic-pill card-node" id="${id}">
      <h4>${esc(t.name)}</h4>
      <div class="transport">${esc(t.transport || 'kafka')}</div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="c2-layout">
      ${extHtml ? `
        <div class="section-label">External Systems</div>
        <div class="c2-row">${extHtml}</div>
      ` : ''}
      <div>
        <div class="section-label">Services</div>
        <div class="c2-row">${svcHtml}</div>
      </div>
      ${topicsHtml ? `
        <div>
          <div class="section-label">Topics / Channels</div>
          <div class="c2-row">${topicsHtml}</div>
        </div>
      ` : ''}
    </div>`;

  clearArrows();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    renderC2Arrows(data);
    const cards = Array.from(document.querySelectorAll('#content .card-node'));
    setupHoverHighlight(cards, (id) => {
      const related = new Set();
      arrowGroups.forEach(g => {
        if (g.fromId === id) related.add(g.toId);
        if (g.toId   === id) related.add(g.fromId);
      });
      return related;
    });
  }));
}

function drillC3(svcName) {
  state.service = svcName;
  setLevel('c3', svcName);
}

function renderC2Arrows(data) {
  // Filter out internal topics from arrow rendering (they show as badge)
  const internalTopicKeys = new Set(
    (data.topics || []).filter(t => t.internal).map(t => t.key)
  );

  (data.edges || []).forEach((e, i) => {
    if (internalTopicKeys.has(e.from) || internalTopicKeys.has(e.to)) return;
    const fromId = keyToId(e.from);
    const toId   = keyToId(e.to);
    const kind   = e.kind === 'async' ? 'async' : 'http';
    drawArrow({ fromId, toId, kind, label: e.label, groupKey: `c2-${i}` });
  });
}

/* ──────────────────────────────────────────────────────
   C3 RENDER
────────────────────────────────────────────────────── */
function renderC3(data) {
  const svcName = data.service?.name || state.service;
  setTabs('c3');
  document.getElementById('tab-c3').disabled = false;
  setBreadcrumb([
    { label: state.c1Data?.name || state.domain, action: () => setLevel('c1') },
    { label: 'Containers', action: () => setLevel('c2') },
    { label: svcName, cur: true }
  ]);
  setSidebar('C3 Components', svcName);
  setLegend([
    { color: '#4a9aea', label: 'Controller' },
    { color: '#7db87d', label: 'Provider', dashed: true },
    { color: '#d4d45e', label: 'Gateway' },
  ]);

  // Build component id map
  const compById = {};
  (data.components || []).forEach(c => {
    compById[c.key] = c;
  });

  // Module groups
  const modulesHtml = (data.modules || []).map(mod => {
    // Get members that are components
    const members = (mod.members || [])
      .map(k => compById[k])
      .filter(Boolean);

    // Also add orphan components not in any module member list
    // (from data.components that don't appear in any module)
    const memberKeys = new Set(mod.members || []);

    const compsHtml = members.map(c => renderCompCard(c)).join('');
    return `<div class="module-box">
      <div class="module-label">${esc(mod.name)}</div>
      <div class="comp-grid">${compsHtml}</div>
    </div>`;
  }).join('');

  // Components not assigned to any module
  const allModMemberKeys = new Set(
    (data.modules || []).flatMap(m => m.members || [])
  );
  const orphans = (data.components || []).filter(c => !allModMemberKeys.has(c.key));
  const orphansHtml = orphans.length ? `
    <div class="module-box">
      <div class="module-label">Other Components</div>
      <div class="comp-grid">${orphans.map(c => renderCompCard(c)).join('')}</div>
    </div>` : '';

  // Boundary panel
  const boundary = data.boundary || {};
  const outgoing = (boundary.outgoing || []).map(b =>
    `<div class="boundary-item">
       <span class="dir">→</span>
       <div>
         <span class="name">${esc(b.to_name)}</span>
         <span class="kind">${esc(b.to_kind)}</span>
         ${b.via ? `<span class="via">via ${esc(b.via)}</span>` : ''}
       </div>
     </div>`
  ).join('');

  const incoming = (boundary.incoming || []).map(b =>
    `<div class="boundary-item">
       <span class="dir">←</span>
       <div>
         <span class="name">${esc(b.from_name)}</span>
         <span class="kind">${esc(b.kind || '')}</span>
       </div>
     </div>`
  ).join('');

  const boundaryHtml = `
    <div class="boundary-panel">
      <h3>Service Boundary</h3>
      ${outgoing ? `<div class="boundary-section">
        <div class="boundary-section-label">Outgoing →</div>
        ${outgoing}
      </div>` : ''}
      ${incoming ? `<div class="boundary-section">
        <div class="boundary-section-label">← Incoming</div>
        ${incoming}
      </div>` : ''}
      ${!outgoing && !incoming ? '<div style="color:#3a3a5a;font-size:9px">No boundary connections</div>' : ''}
    </div>`;

  document.getElementById('content').innerHTML = `
    <div class="c3-layout">
      <div class="c3-body">
        <div class="c3-modules">
          ${modulesHtml}
          ${orphansHtml}
        </div>
        ${boundaryHtml}
      </div>
    </div>`;

  clearArrows();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    renderC3Arrows(data);
    const cards = Array.from(document.querySelectorAll('#content .card-node'));
    setupHoverHighlight(cards, (id) => {
      const related = new Set();
      arrowGroups.forEach(g => {
        if (g.fromId === id) related.add(g.toId);
        if (g.toId   === id) related.add(g.fromId);
      });
      return related;
    });
  }));
}

function renderCompCard(c) {
  const id = keyToId(c.key);
  const typeClass = c.type === 'controller' ? 't-controller'
    : c.type === 'provider' ? 't-provider'
    : c.type === 'gateway'  ? 't-gateway' : '';

  const epPills = (c.endpoints || []).map(ep =>
    `<span class="ep-pill">${esc(ep.name)}</span>`
  ).join('');

  const modelChips = (c.uses_models || []).map(m =>
    `<span class="model-chip">${esc(m)}</span>`
  ).join('');

  return `<div class="comp-card card-node ${typeClass}" id="${id}">
    <h5>${esc(c.name)}</h5>
    <div class="comp-type">${esc(c.type || '')}</div>
    ${epPills ? `<div style="margin-top:4px">${epPills}</div>` : ''}
    ${modelChips ? `<div style="margin-top:4px">${modelChips}</div>` : ''}
  </div>`;
}

function renderC3Arrows(data) {
  (data.internal_edges || []).forEach((e, i) => {
    const fromId = keyToId(e.from);
    const toId   = keyToId(e.to);
    const kind   = e.kind === 'injects' ? 'inject' : 'http';
    drawArrow({ fromId, toId, kind, label: null, groupKey: `c3-${i}` });
  });
}

/* ──────────────────────────────────────────────────────
   HELPERS
────────────────────────────────────────────────────── */
function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
