<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>C4 Architecture — Chronicle</title>
<script>
// c4.html is retired — the view engine now powers the dashboard Graph tab
// (index.html, Level control). This stub keeps old URLs working
// (e.g. MCP-returned links); both hashes open the Graph tab in view mode:
//   c4.html?session=<id>                    → /#c4/s/<id>
//   c4.html?domain=X&level=c2&service=Y     → /#c4?domain=X&level=c2&service=Y
(function () {
  var p = new URLSearchParams(location.search);
  var session = p.get('session');
  var hash;
  if (session) {
    hash = '#c4/s/' + encodeURIComponent(session);
  } else {
    var q = new URLSearchParams();
    ['domain', 'level', 'service'].forEach(function (k) {
      var v = p.get(k);
      if (v) q.set(k, v);
    });
    var qs = q.toString();
    hash = '#c4' + (qs ? '?' + qs : '');
  }
  location.replace('/' + hash);
})();
</script>
</head>
<body>Redirecting to the dashboard…</body>
</html>
