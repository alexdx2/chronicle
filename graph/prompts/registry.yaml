packs:
  # Core — always loaded for every scan, framework-agnostic
  - id: core/fact_schema
    type: core
    always_load: true
    description: Architectural fact extraction schema and output contract
    path: fact_schema.md

  - id: core/enrichment
    type: core
    always_load: true
    description: Candidate classification and additional fact extraction
    path: enrichment.md

  - id: core/flow_tracing
    type: core
    always_load: true
    description: Business flow tracing from entry points
    path: flow_tracing.md

  # Technology packs are NOT registered here.
  # They are matched by name from the manifest tech field.
  # Built-in defaults: typescript, nestjs, prisma, graphql, dotnet
  # Custom packs: saved to .depbot/packs/ by agents during scan
