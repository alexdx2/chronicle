spring:
  cloud:
    stream:
      bindings:
        pay-in-0:
          destination: s-payments, s-refunds
          group: g
        pay-out-0:
          destination: s-receipts
        plain-binding:
          destination: s-unknown-direction
        env-in-0:
          destination: ${ENV_TOPIC}
        # old-in-0:
