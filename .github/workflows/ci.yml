name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: CGO_ENABLED=1 go test ./... -count=1 -v

  build-linux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install cross-compiler
        if: matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: |
          mkdir -p dist
          export CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }}
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
          fi
          go build -ldflags '-s -w' -o dist/chronicle-linux-${{ matrix.goarch }} ./cmd/chronicle
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.goarch }}
          path: dist/

  build-windows:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -ldflags '-s -w' -o dist/chronicle-windows-amd64.exe ./cmd/chronicle
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-amd64
          path: dist/

  build-darwin:
    # Both arches build on the Apple-Silicon runner: arm64 native, amd64
    # cross-compiled via clang -arch x86_64. Avoids the scarce/deprecated
    # macos-13 Intel runner that left release builds queued indefinitely.
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: |
          mkdir -p dist
          export CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.goarch }}
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            export CC="clang -arch x86_64"
          fi
          go build -ldflags '-s -w' -o dist/chronicle-darwin-${{ matrix.goarch }} ./cmd/chronicle
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin-${{ matrix.goarch }}
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-darwin]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist/
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Chronicle MCP ${{ github.ref_name }}
          files: dist/*

  publish-npm:
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Sync version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm && npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: cd npm && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
