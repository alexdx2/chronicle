domains:
  - name: tom-and-jerry
    description: Multi-service chase simulation with arena battles, spectators, and character APIs
    owner: alex
    scan:
      include:
        - "arena-api/src/**"
        - "tom-api/src/**"
        - "jerry-api/src/**"
        - "spectators-api/src/**"
        - "shared/src/**"
        - "arena-api/prisma/**"
        - "tom-api/prisma/**"
        - "jerry-api/prisma/**"
      exclude:
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/node_modules/**"

tech: [nestjs, prisma, kafka, typescript]

infrastructure:
  - name: kafka
    type: broker
    address: kafka:9092
    description: Event bus for battle results and cross-service events

instruction_packs: [typescript, nestjs, graphql, prisma, custom/kafka]
