domains:
  - name: tom-and-jerry
    description: Tom and Jerry microservices — 4 NestJS services with Prisma, HTTP, and Kafka
    owner: alex
    scan:
      include:
        - "arena-api/src/**"
        - "tom-api/src/**"
        - "jerry-api/src/**"
        - "spectators-api/src/**"
        - "shared/src/**"
        - "arena-api/prisma/**"
        - "tom-api/prisma/**"
        - "jerry-api/prisma/**"
      exclude:
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/node_modules/**"

tech: [nestjs, prisma, kafka, typescript]

infrastructure:
  - name: kafka
    type: broker
    address: kafka:9092
    description: Event bus connecting all services
  - name: redis
    type: cache
    address: redis:6379
    description: Shared cache for battle state and session data

instruction_packs: [language/typescript, framework/nestjs, framework/graphql, orm/prisma]
