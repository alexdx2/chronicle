version: "1"
domains:
  tom-and-jerry:
    name: Tom and Jerry
    description: 4 NestJS microservices — battle arena with Tom, Jerry, and spectator stats
    tech:
      - typescript
      - nestjs
      - prisma
    infrastructure:
      - name: postgres
        type: database
      - name: kafka
        type: broker
    scan:
      include:
        - "arena-api/src/**"
        - "arena-api/prisma/**"
        - "tom-api/src/**"
        - "tom-api/prisma/**"
        - "jerry-api/src/**"
        - "jerry-api/prisma/**"
        - "spectators-api/src/**"
        - "shared/src/**"
      exclude:
        - "**/*.spec.ts"
        - "**/*.test.ts"
        - "**/node_modules/**"
    instruction_packs:
      - language/typescript
      - framework/nestjs
      - orm/prisma